services:
  
  api-python:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db-postgres 
      - db-mongo    

  
  app-node:
    build:
      context: ./frontend
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-python

  
  db-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=api5_relacional
    ports:
      - "5432:5432" 
    volumes:
      - pg_data:/var/lib/postgresql/data

  
  db-mongo:
    image: mongo:6-jammy
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db


volumes:
  pg_data:
  mongo_data: