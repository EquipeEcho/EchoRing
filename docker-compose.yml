services:
  api-python:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: db-postgres
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db-postgres:
        condition: service_healthy

  app-node:
    build:
      context: ./frontend
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-python

  db-postgres:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mantido para compatibilidade com trabalhos existentes da equipe.
  # A API principal persiste todos os seus dados somente no PostgreSQL.
  db-mongo:
    image: mongo:6-jammy
    env_file:
      - ./backend/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


volumes:
  pg_data:
  mongo_data:
